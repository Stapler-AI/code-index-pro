# code-index — Agent Task Graph
#
# Machine-readable conversion of tasks.md (kept unchanged as the archival
# reference). The PRD and the spec docs it cites remain the design authority —
# every node links to its source. This file only sequences and scopes the work.
#
# Node semantics
# --------------
# - Every FR is a DEV/QA/REV triplet sharing a numeric id (DEV-104 implements
#   FR-104, QA-104 tests it, REV-104 reviews the pair). x00-series ids cover
#   non-FR work (scaffolding, hardening).
# - Edges are `depends_on` lists (task ids only, no prose). The only edges
#   inside a triplet point backward: QA -> DEV, REV -> {DEV, QA}. A DEV node's
#   completion criterion references its `verified_by` QA node via `done_when`;
#   that coupling is deliberately NOT an edge (it would be circular).
# - `gate` nodes make milestone review-completion machine-visible: each gate
#   depends on all of its milestone's REV nodes. Ordinary task edges never
#   point at REV or gate nodes, so work in later milestones can proceed in
#   parallel exactly as tasks.md allows; gates only checkpoint milestone
#   completion. RELEASE depends on all gates.
#
# Status lifecycle
# ----------------
# - dev / qa nodes: pending -> in_progress -> done. A REV rework verdict resets
#   the affected node(s) from done to rework; fix, re-run QA, return to done.
# - rev nodes:      pending -> in_progress -> approved | rework. On rework,
#   record findings (in the review conversation / PR), set the paired dev/qa
#   node(s) to rework, and set the rev node back to pending once rework starts.
#   Terminal state is approved.
# - gate nodes:     pending -> approved. Flip to approved automatically when
#   every depends_on REV node is approved; never worked on directly.
# Orchestrators update ONLY `status:` fields. Never reorder, renumber, or
# delete nodes.

version: 1
source: tasks.md
states: [pending, in_progress, done, rework, approved]

scheduling:
  select: >-
    Pick the first node in file order with status pending whose depends_on
    nodes all have status done (or approved, for rev/gate dependencies).
    Skip qa, rev, and gate nodes during selection — they are reached through
    the triplet rule and gate rule below, not picked independently.
  triplet_rule: >-
    Execute each triplet as a unit and work test-adjacent: complete DEV-xxx,
    then immediately its verified_by QA-xxx, then its reviewed_by REV-xxx,
    before selecting the next node.
  rework_rule: >-
    A rework verdict from a REV node sets the defective dev/qa node(s) to
    rework. Address the findings, re-run the QA tests, set the pair back to
    done, and re-request review. Repeat until the REV node is approved.
  gate_rule: >-
    A milestone is complete only when its gate node is approved (all its REV
    nodes approved). Gates never block other tasks' depends_on; they are
    checkpoints — summarize progress at each gate before continuing.

conventions:
  critical_path: DEV-000 -> M1 storage -> M2 pipeline -> M3 graph -> M4 queries -> M5 server -> M7 hardening
  parallel_branches:
    - M6 structural search depends only on DEV-601 (server shell), not on the
      index — it can proceed in parallel with M3/M4 work; its tool registration
      slots into DEV-602's catalog when that lands.
    - M8 benchmark authoring (DEV-901..905, DEV-907) needs only QA-000;
      end-to-end `bench run` with-arms need M5 (DEV-704); the task generator
      (DEV-908) needs the M2 CLI (DEV-701) and M3 resolution (DEV-304).
  shared_fixtures: >-
    QA-000 fixtures are shared infrastructure: every QA node depends on it.
    Extend the fixture repos there (not ad-hoc per test) so golden rows stay
    consistent.
  risks: >-
    PRD §8 cross-cutting risks: pin tree-sitter/better-sqlite3 versions at
    DEV-000 and verify native builds early; cover both `typescript` and `tsx`
    grammars in every M3 fixture; pin a minimum ast-grep version at DEV-501.
  benchmarks_manual_only: >-
    Benchmark runs are manual and deliberate — never CI-scheduled
    (benchmark.md §Non-goals).
  review_scope: >-
    Applies to every rev node (their `scope` is this text): the code review
    agent reviews the paired DEV implementation and QA tests against the
    linked spec sections — implementation matches the spec and stays within
    task scope; tests genuinely encode the acceptance criteria (not weakened
    to pass); no unrelated changes. Approve, or return findings for rework.

milestones:
  - {id: M1, title: "Scaffolding + storage layer", gate: GATE-M1}
  - {id: M2, title: "Indexer pipeline + basic CLI", gate: GATE-M2}
  - {id: M3, title: "Symbol graph", gate: GATE-M3}
  - {id: M4, title: "Query layer", gate: GATE-M4}
  - {id: M5, title: "MCP server", gate: GATE-M5}
  - {id: M6, title: "Structural search", gate: GATE-M6}
  - {id: M7, title: "Hardening & dogfood", gate: GATE-M7}
  - {id: M8, title: "Benchmark suite", gate: GATE-M8}

nodes:
  # ── M1 — Scaffolding + storage layer ──────────────────────────────────────

  - id: DEV-000
    title: "Project scaffolding"
    type: dev
    milestone: M1
    status: done
    implements: ["PRD §6 technical requirements", "FR-705 (bin wiring)"]
    spec: ["prd.md#6-technical-requirements"]
    depends_on: []
    verified_by: QA-000
    reviewed_by: REV-000
    scope: >-
      TypeScript project setup: tsconfig.json, src/ layout, build script.
      Dependencies with versions pinned (native-build risk, PRD §8):
      better-sqlite3, tree-sitter, tree-sitter-javascript,
      tree-sitter-typescript, @modelcontextprotocol/sdk. Test runner installed
      and configured. package.json bin entry `code-index` -> CLI stub (prints
      usage; real commands come in M2/M5).
    done_when: >-
      Build passes, native modules compile on the dev platform, the bin stub
      runs, and QA-000's smoke test passes.

  - id: QA-000
    title: "Test harness + shared fixture repos"
    type: qa
    milestone: M1
    status: done
    implements: ["PRD §6 testing requirement (automated tests per milestone against fixture repos)"]
    depends_on: [DEV-000]
    scope: >-
      Test-runner config wired into package.json scripts. Fixture-repo
      builders (temp-dir based, reused by all later QA tasks): a small repo
      with JS + TS + TSX files, in git and non-git variants; helpers to
      write/edit/delete fixture files mid-test. DB helpers: open a fixture's
      .code-index/index.db, query rows, count writes.
    done_when: >-
      A smoke test builds both fixture variants and asserts their file layout;
      harness runs green in CI-style invocation.

  - id: REV-000
    title: "Review: Project scaffolding"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for PRD §6 technical requirements, FR-705"]
    spec: ["prd.md#6-technical-requirements"]
    depends_on: [DEV-000, QA-000]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-101
    title: "Database location & lifecycle"
    type: dev
    milestone: M1
    status: done
    implements: [FR-101]
    spec: ["schema.md#overview"]
    depends_on: [DEV-000]
    verified_by: QA-101
    reviewed_by: REV-101
    scope: >-
      Open/create one SQLite DB per repo at .code-index/index.db via
      better-sqlite3 (create .code-index/ as needed). Pragmas on open:
      journal_mode = WAL, foreign_keys = ON, synchronous = NORMAL.
      .code-index/ is excluded from indexing (enforced in DEV-201's discovery;
      the exclusion constant lives here).
    done_when: "QA-101 passes."

  - id: QA-101
    title: "Tests: database open & pragmas"
    type: qa
    milestone: M1
    status: done
    implements: ["FR-101 acceptance"]
    depends_on: [DEV-101, QA-000]
    scope: >-
      Tests that opening a fixture repo creates .code-index/index.db; the
      three pragma values read back as configured; reopening an existing
      database succeeds without recreating it.
    done_when: "Tests pass."

  - id: REV-101
    title: "Review: Database location & lifecycle"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for FR-101"]
    spec: ["schema.md#overview"]
    depends_on: [DEV-101, QA-101]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-102
    title: "Core tables"
    type: dev
    milestone: M1
    status: done
    implements: [FR-102]
    spec: ["schema.md#core-tables-ported"]
    depends_on: [DEV-101]
    verified_by: QA-102
    reviewed_by: REV-102
    scope: >-
      indexed_files and code_chunks exactly as specified — columns,
      relative_path UNIQUE, ON DELETE CASCADE from files to chunks,
      idx_chunks_file_id, idx_chunks_node_type, snake_case, ISO-8601 text
      timestamps, integer booleans. (Created via the migration mechanism once
      DEV-106 lands; a first migration file is acceptable here.)
    done_when: "QA-102 passes."

  - id: QA-102
    title: "Tests: core tables"
    type: qa
    milestone: M1
    status: done
    implements: ["FR-102 acceptance"]
    depends_on: [DEV-102, QA-000]
    scope: >-
      Schema-introspection tests (sqlite_master, PRAGMA table_info): all
      columns/types/indexes present; duplicate relative_path insert fails;
      deleting an indexed_files row cascades to its code_chunks.
    done_when: "Tests pass."

  - id: REV-102
    title: "Review: Core tables"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for FR-102"]
    spec: ["schema.md#core-tables-ported"]
    depends_on: [DEV-102, QA-102]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-103
    title: "Graph tables"
    type: dev
    milestone: M1
    status: done
    implements: [FR-103]
    spec: ["schema.md#graph-tables-new"]
    depends_on: [DEV-102]
    verified_by: QA-103
    reviewed_by: REV-103
    scope: >-
      symbols and edges exactly as specified: cascade from indexed_files;
      symbols.chunk_id -> ON DELETE SET NULL; edges.source_symbol_id ->
      CASCADE; edges.target_symbol_id -> SET NULL; indexes idx_symbols_name,
      idx_symbols_file, and the four edge indexes (source, target,
      target_name, type).
    done_when: "QA-103 passes."

  - id: QA-103
    title: "Tests: graph tables & delete behaviors"
    type: qa
    milestone: M1
    status: done
    implements: ["FR-103 acceptance"]
    depends_on: [DEV-103, QA-000]
    scope: >-
      Tests: deleting a file cascades to its symbols and edges; deleting a
      chunk nulls symbols.chunk_id; deleting a target symbol nulls
      edges.target_symbol_id while deleting a source symbol removes the edge;
      all six indexes exist.
    done_when: "Tests pass."

  - id: REV-103
    title: "Review: Graph tables"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for FR-103"]
    spec: ["schema.md#graph-tables-new"]
    depends_on: [DEV-103, QA-103]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-104
    title: "FTS5 mirror"
    type: dev
    milestone: M1
    status: done
    implements: [FR-104]
    spec: ["schema.md#full-text-search-new"]
    depends_on: [DEV-102]
    verified_by: QA-104
    reviewed_by: REV-104
    scope: >-
      External-content chunks_fts over content + node_name
      (content='code_chunks', content_rowid='id'); AFTER INSERT and AFTER
      DELETE triggers exactly as in the spec (no UPDATE trigger — the indexer
      never updates chunk rows).
    done_when: "QA-104 passes."

  - id: QA-104
    title: "Tests: FTS consistency"
    type: qa
    milestone: M1
    status: done
    implements: ["FR-104 acceptance (FTS content stays consistent with code_chunks after insert/delete cycles)"]
    depends_on: [DEV-104, QA-000]
    scope: >-
      Tests: inserted chunks are findable via MATCH on both content and
      node_name; after repeated insert->delete->insert cycles, FTS row count
      equals code_chunks count and deleted content is unfindable; a
      bm25()-ordered query with snippet() returns the spec's join shape.
    done_when: "Tests pass."

  - id: REV-104
    title: "Review: FTS5 mirror"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for FR-104"]
    spec: ["schema.md#full-text-search-new"]
    depends_on: [DEV-104, QA-104]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-105
    title: "Meta table"
    type: dev
    milestone: M1
    status: done
    implements: [FR-105]
    spec: ["schema.md#meta-table"]
    depends_on: [DEV-102]
    verified_by: QA-105
    reviewed_by: REV-105
    scope: >-
      meta key/value table; populate schema_version, repo_root (absolute path
      at creation), tool_version on database creation; a check helper that
      reports mismatch (incompatible version, copied database) for the health
      check to act on.
    done_when: "QA-105 passes."

  - id: QA-105
    title: "Tests: meta population & mismatch detection"
    type: qa
    milestone: M1
    status: done
    implements: ["FR-105 acceptance"]
    depends_on: [DEV-105, QA-000]
    scope: >-
      Tests: a fresh database contains the three rows with correct values; the
      mismatch helper flags a database whose repo_root differs (simulated
      copy) and whose schema_version differs.
    done_when: "Tests pass."

  - id: REV-105
    title: "Review: Meta table"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for FR-105"]
    spec: ["schema.md#meta-table"]
    depends_on: [DEV-105, QA-105]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-106
    title: "Migrations"
    type: dev
    milestone: M1
    status: done
    implements: [FR-106]
    spec: ["schema.md#migrations"]
    depends_on: [DEV-102, DEV-103, DEV-104, DEV-105]
    verified_by: QA-106
    reviewed_by: REV-106
    scope: >-
      Numbered forward-only migration runner tracked via PRAGMA user_version;
      each migration in its own transaction, bumping user_version last; all
      table/trigger/index DDL from DEV-102/103/104/105 consolidated as
      migration 1; a user_version higher than the tool knows is reported as
      foreign (quarantine handled by DEV-107).
    done_when: "QA-106 passes."

  - id: QA-106
    title: "Tests: migration runner"
    type: qa
    milestone: M1
    status: done
    implements: ["FR-106 acceptance"]
    depends_on: [DEV-106, QA-000]
    scope: >-
      Tests: a fresh database migrates 0->current and user_version matches;
      reopening is a no-op (no DDL re-runs); a database with user_version =
      current+1 is reported foreign.
    done_when: "Tests pass."

  - id: REV-106
    title: "Review: Migrations"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for FR-106"]
    spec: ["schema.md#migrations"]
    depends_on: [DEV-106, QA-106]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-107
    title: "Health check & quarantine-and-rebuild"
    type: dev
    milestone: M1
    status: done
    implements: [FR-107]
    spec: ["schema.md#health-check-and-recovery"]
    depends_on: [DEV-106]
    verified_by: QA-107
    reviewed_by: REV-107
    scope: >-
      On every open: required tables exist (indexed_files, code_chunks,
      symbols, edges, chunks_fts, meta) via sqlite_master; PRAGMA quick_check
      returns exactly "ok"; meta values match (DEV-105 helper); foreign
      user_version (DEV-106) fails the check. On failure: move index.db +
      -wal/-shm sidecars to index.db.quarantine-<ISO-timestamp>; create fresh;
      run migrations; flag "full re-index required"; record a recovery event
      retrievable later by index_status (FR-604).
    done_when: "QA-107 passes."

  - id: QA-107
    title: "Tests: recovery drill"
    type: qa
    milestone: M1
    status: done
    implements: ["FR-107 acceptance (corrupted file quarantined with sidecars and rebuilt; fresh DB passes health check; higher user_version rebuilds)"]
    depends_on: [DEV-107, QA-000]
    scope: >-
      Tests: a fresh database passes the health check; overwriting index.db
      with garbage bytes -> open succeeds, quarantine file (with sidecars)
      exists with ISO-stamped name, new database is healthy, recovery event
      recorded; a higher-user_version database is quarantined and rebuilt; a
      copied database (wrong repo_root) is rebuilt.
    done_when: "Tests pass."

  - id: REV-107
    title: "Review: Health check & quarantine-and-rebuild"
    type: rev
    milestone: M1
    status: approved
    implements: ["Review gate for FR-107"]
    spec: ["schema.md#health-check-and-recovery"]
    depends_on: [DEV-107, QA-107]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-108
    title: "Write patterns"
    type: dev
    milestone: M1
    status: pending
    implements: [FR-108]
    spec: ["schema.md#write-patterns"]
    depends_on: [DEV-106]
    verified_by: QA-108
    reviewed_by: REV-108
    scope: >-
      upsertFile (by relative_path, returns id); replaceChunks(fileId, chunks)
      as delete-then-insert (keeps FTS triggers sufficient), maintaining
      chunk_count; same-pattern replacement for a file's symbols and edges;
      stale-prune helper (delete indexed_files rows not in a seen-set); all
      per-file writes wrapped in one transaction.
    done_when: "QA-108 passes."

  - id: QA-108
    title: "Tests: write patterns & atomicity"
    type: qa
    milestone: M1
    status: pending
    implements: ["FR-108 acceptance"]
    depends_on: [DEV-108, QA-000]
    scope: >-
      Tests: upsertFile twice with same path returns the same id with updated
      fields; replaceChunks leaves chunk_count and FTS consistent; graph-row
      replacement removes old rows and inserts fresh; a failure injected
      mid-write rolls back the whole file (no half-indexed state); prune
      helper cascades.
    done_when: "Tests pass."

  - id: REV-108
    title: "Review: Write patterns"
    type: rev
    milestone: M1
    status: pending
    implements: ["Review gate for FR-108"]
    spec: ["schema.md#write-patterns"]
    depends_on: [DEV-108, QA-108]
    done_when: "Review approved with no unresolved findings."

  - id: GATE-M1
    title: "Milestone gate: Scaffolding + storage layer"
    type: gate
    milestone: M1
    status: pending
    depends_on: [REV-000, REV-101, REV-102, REV-103, REV-104, REV-105, REV-106, REV-107, REV-108]
    done_when: "All M1 REV nodes approved."

  # ── M2 — Indexer pipeline + basic CLI ─────────────────────────────────────

  - id: DEV-201
    title: "File discovery"
    type: dev
    milestone: M2
    status: pending
    implements: [FR-201]
    spec: ["indexing.md#file-discovery"]
    depends_on: [DEV-000]
    verified_by: QA-201
    reviewed_by: REV-201
    scope: >-
      `git ls-files --cached --others --exclude-standard` from the repo root,
      paths under .code-index/ excluded; non-git fallback: glob walk skipping
      node_modules, .git, hidden directories, .code-index.
    done_when: "QA-201 passes."

  - id: QA-201
    title: "Tests: discovery (git + fallback)"
    type: qa
    milestone: M2
    status: pending
    implements: ["FR-201 acceptance", "FR-200 acceptance (a non-git directory indexes via the fallback walker)"]
    depends_on: [DEV-201, QA-000]
    scope: >-
      Tests on both fixture variants: git repo lists tracked + untracked files
      but not gitignored ones or .code-index/; non-git walk skips
      node_modules, hidden dirs, .git.
    done_when: "Tests pass."

  - id: REV-201
    title: "Review: File discovery"
    type: rev
    milestone: M2
    status: pending
    implements: ["Review gate for FR-201"]
    spec: ["indexing.md#file-discovery"]
    depends_on: [DEV-201, QA-201]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-202
    title: "Language detection"
    type: dev
    milestone: M2
    status: pending
    implements: [FR-202]
    spec: ["indexing.md#language-detection"]
    depends_on: [DEV-000]
    verified_by: QA-202
    reviewed_by: REV-202
    scope: >-
      Extension -> language mapping for v1: js|mjs|cjs|jsx -> javascript,
      ts|mts|cts -> typescript, tsx -> tsx; unrecognized extensions are
      skipped entirely (staged languages stay out).
    done_when: "QA-202 passes."

  - id: QA-202
    title: "Tests: language detection"
    type: qa
    milestone: M2
    status: pending
    implements: ["FR-202 acceptance"]
    depends_on: [DEV-202, QA-000]
    scope: >-
      Table-driven test over all eight v1 extensions plus unknown ones (.json,
      .py, .md, no extension) asserting skip.
    done_when: "Tests pass."

  - id: REV-202
    title: "Review: Language detection"
    type: rev
    milestone: M2
    status: pending
    implements: ["Review gate for FR-202"]
    spec: ["indexing.md#language-detection"]
    depends_on: [DEV-202, QA-202]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-203
    title: "Change detection"
    type: dev
    milestone: M2
    status: pending
    implements: [FR-203]
    spec: ["indexing.md#change-detection"]
    depends_on: [DEV-108]
    verified_by: QA-203
    reviewed_by: REV-203
    scope: >-
      Per discovered file: skip > 1 MB; skip non-UTF-8 (decode failure =
      binary); SHA-256 of raw bytes; skip when an indexed_files row matches
      (relative_path, file_hash).
    done_when: "QA-203 passes."

  - id: QA-203
    title: "Tests: change detection"
    type: qa
    milestone: M2
    status: pending
    implements: ["FR-203 acceptance", "FR-200 acceptance (a 1 MB+ file and a binary file are skipped)"]
    depends_on: [DEV-203, QA-000]
    scope: >-
      Tests: a 1 MB+ fixture file is skipped; a binary (invalid UTF-8) file is
      skipped; an unchanged file (matching hash row) is skipped; a content
      change (new hash) is selected for re-index.
    done_when: "Tests pass."

  - id: REV-203
    title: "Review: Change detection"
    type: rev
    milestone: M2
    status: pending
    implements: ["Review gate for FR-203"]
    spec: ["indexing.md#change-detection"]
    depends_on: [DEV-203, QA-203]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-204
    title: "Chunk extraction"
    type: dev
    milestone: M2
    status: pending
    implements: [FR-204]
    spec: ["indexing.md#chunk-extraction"]
    depends_on: [DEV-108, DEV-202]
    verified_by: QA-204
    reviewed_by: REV-204
    scope: >-
      tree-sitter parse; recursive walk emitting a code_chunks row per node in
      the per-language meaningful-node-types allowlist (javascript and
      typescript/tsx lists verbatim from the spec). Per chunk: node_name from
      the node's name field; context_path of meaningful ancestors + self
      joined with " > "; depth counting meaningful ancestors only; 1-indexed
      lines; byte offsets; content capped at 2000 chars with "..." appended.
      Nested meaningful nodes each get their own chunk (class chunk + one per
      method).
    done_when: "QA-204 passes."

  - id: QA-204
    title: "Tests: chunk extraction"
    type: qa
    milestone: M2
    status: pending
    implements: ["FR-204 acceptance"]
    depends_on: [DEV-204, QA-000]
    scope: >-
      Golden-row tests per language (JS, TS, TSX fixtures): expected
      node_type, node_name, context_path, depth, line numbers; a >2000-char
      function is truncated with trailing "..." while its byte offsets still
      slice the full body from the source file; a class yields its own chunk
      plus per-method chunks.
    done_when: "Tests pass."

  - id: REV-204
    title: "Review: Chunk extraction"
    type: rev
    milestone: M2
    status: pending
    implements: ["Review gate for FR-204"]
    spec: ["indexing.md#chunk-extraction"]
    depends_on: [DEV-204, QA-204]
    done_when: "Review approved with no unresolved findings."

  - id: DEV-205
    title: "Stale pruning"
    type: dev
    milestone: M2
    status: pending
    implements: [FR-205]
    spec: ["indexing.md#change-detection"]
    depends_on: [DEV-108, DEV-201]
    verified_by: QA-205
    reviewed_by: REV-205
